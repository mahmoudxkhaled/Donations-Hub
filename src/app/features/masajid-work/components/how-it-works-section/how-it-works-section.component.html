<section class="process" aria-labelledby="process-heading">
  <div class="process__inner">
    <h2 id="process-heading" class="process__title">How Masajid Work Works</h2>
    <div class="process__wrap">
      <div class="process__line" aria-hidden="true"></div>
      <ol class="process__grid">
        <li class="process__step" *ngFor="let step of steps">
          <div class="process__num" [class.process__num--accent]="step.highlight">
            {{ step.number }}
          </div>
          <p class="process__step-title">{{ step.title }}</p>
          <p class="process__step-sub">{{ step.subtitle }}</p>
        </li>
      </ol>
    </div>
  </div>
</section>
