<section class="donate" aria-labelledby="donate-heading">
  <div class="donate__inner">
    <h2 id="donate-heading" class="donate__title">Items You Can Donate</h2>
    <div class="donate__grid">
      <a class="donate__cell" *ngFor="let c of categories" href="#">
        <div class="donate__thumb">
          <img [src]="c.imageSrc" [alt]="c.alt" class="donate__img" loading="lazy" decoding="async" />
        </div>
        <p class="donate__label">{{ c.label }}</p>
      </a>
    </div>
  </div>
</section>
