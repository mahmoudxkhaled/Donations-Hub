<section class="cta" aria-labelledby="cta-heading">
  <div class="cta__inner">
    <div class="cta__panel">
      <div class="cta__glow cta__glow--tl" aria-hidden="true"></div>
      <div class="cta__glow cta__glow--br" aria-hidden="true"></div>
      <h2 id="cta-heading" class="cta__title">{{ 'masajidWork.cta.title' | translate }}</h2>
      <p class="cta__lead">{{ 'masajidWork.cta.lead' | translate }}</p>
      <div class="cta__actions">
        <button type="button" class="cta__btn cta__btn--solid">
          {{ 'masajidWork.cta.donorBtn' | translate }}
        </button>
        <button type="button" class="cta__btn cta__btn--ghost">
          {{ 'masajidWork.cta.facilityBtn' | translate }}
        </button>
        <button type="button" class="cta__btn cta__btn--link">{{ 'masajidWork.cta.login' | translate }}</button>
      </div>
    </div>
  </div>
</section>
